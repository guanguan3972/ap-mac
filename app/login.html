<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>登录</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Microsoft YaHei", sans-serif; background:#f2f5fa;
         display:flex; align-items:center; justify-content:center; height:100vh; }
  .box { width: 320px; background:#fff; border-radius:14px; padding:26px 24px;
         box-shadow: 0 12px 40px rgba(15,23,42,.12); }
  h2 { margin:0 0 18px; font-size:17px; color:#1e293b; text-align:center; }
  input { width:100%; padding:10px 12px; margin-bottom:12px; border:1px solid #dbe4f0;
          border-radius:8px; font-size:14px; outline:none; }
  input:focus { border-color:#3b82f6; }
  button { width:100%; padding:11px; border:0; border-radius:8px; background:#2563eb;
           color:#fff; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:#dc2626; font-size:12px; min-height:18px; margin-bottom:8px; text-align:center; }
  .tip { color:#94a3b8; font-size:11px; text-align:center; margin-top:10px; }
</style>
</head>
<body>
  <div class="box">
    <h2>阿p全自动发布工具</h2>
    <div class="err" id="err"></div>
    <input id="user" placeholder="用户名" autocomplete="username">
    <input id="pass" type="password" placeholder="密码" autocomplete="current-password">
    <button id="btn">登 录</button>
    <div class="tip">账号由管理员发放</div>
  </div>
  <script src="login.js"></script>
</body>
</html>

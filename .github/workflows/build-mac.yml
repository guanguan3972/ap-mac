name: build-mac-dmg

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install

      - name: 打包 dmg（Intel + Apple 芯片）
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --x64 --arm64 --publish never

      - name: 列出产物
        run: ls -lh dist

      - name: 上传 dmg
        uses: actions/upload-artifact@v4
        with:
          name: ap-mac-dmg
          path: |
            dist/*.dmg
            dist/*.blockmap
          if-no-files-found: error

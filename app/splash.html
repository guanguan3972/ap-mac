<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>阿p全自动发布工具</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: transparent; user-select: none;
  }
  #app {
    height: 100%;
    display: flex;
    background: linear-gradient(150deg, #0f172a 0%, #172033 45%, #101827 100%);
    border-radius: 16px;
    border: 1px solid rgba(96,165,250,.25);
    box-shadow: 0 24px 60px rgba(0,0,0,.55);
    overflow: hidden;
    position: relative;
  }
  /* 背景光斑 */
  #app::before {
    content: '';
    position: absolute; width: 320px; height: 320px; left: -90px; top: -110px;
    background: radial-gradient(circle, rgba(59,130,246,.42), transparent 68%);
    filter: blur(6px);
  }
  #app::after {
    content: '';
    position: absolute; width: 260px; height: 260px; right: -80px; bottom: -110px;
    background: radial-gradient(circle, rgba(56,189,248,.28), transparent 70%);
  }

  /* 左侧：鲸鱼动画 */
  #left {
    width: 190px; flex: 0 0 190px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; padding: 18px 10px;
    position: relative; z-index: 1;
  }
  #whale {
    font-size: 62px; line-height: 1;
    animation: float 2.6s ease-in-out infinite;
    filter: drop-shadow(0 10px 18px rgba(56,189,248,.45));
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-12px) rotate(3deg); }
  }
  #name { font-size: 15px; font-weight: 700; color: #e8f1ff; letter-spacing: .5px; }
  #ver { font-size: 11px; color: #7f9bc4; }
  #bar {
    width: 120px; height: 4px; border-radius: 3px; overflow: hidden;
    background: rgba(255,255,255,.1);
  }
  #bar i {
    display: block; height: 100%; width: 40%;
    background: linear-gradient(90deg, transparent, #60a5fa, #38bdf8, transparent);
    animation: slide 1.15s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(330%); }
  }

  /* 右侧：更新日志 */
  #right {
    flex: 1; min-width: 0;
    padding: 20px 20px 16px 8px;
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
  }
  #right h2 {
    margin: 0 0 12px; font-size: 12.5px; font-weight: 600;
    color: #93c5fd; letter-spacing: 1px;
  }
  #log { flex: 1; overflow: hidden; }
  .entry { margin-bottom: 14px; }
  .entry .v {
    font-size: 12px; color: #e2e8f0; font-weight: 600;
  }
  .entry .v span { color: #64748b; font-weight: 400; margin-left: 6px; font-size: 10.5px; }
  .entry ul {
    margin: 6px 0 0; padding-left: 15px;
  }
  .entry li {
    font-size: 11.5px; color: #9fb3ce; line-height: 1.75;
  }
  .entry.new .v { color: #7dd3fc; }
  #actions { display: flex; gap: 8px; margin-top: 12px; }
  #actions button {
    flex: 1; height: 30px; border-radius: 8px; cursor: pointer;
    font-size: 12px; border: 1px solid transparent; transition: all .15s;
  }
  #btn-update { background: rgba(255,255,255,.07); color: #cbd5e1; border-color: rgba(255,255,255,.13); }
  #btn-update:hover { background: rgba(96,165,250,.18); color: #dbeafe; border-color: rgba(96,165,250,.5); }
  #btn-enter { background: linear-gradient(180deg,#3b82f6,#2563eb); color: #fff; font-weight: 600; }
  #btn-enter:hover { filter: brightness(1.1); }
  #tip {
    margin-top: 8px;
    font-size: 10.5px; color: #4b5f7a; text-align: right;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="left">
      <div id="whale">🐋</div>
      <div id="name">阿p全自动发布工具</div>
      <div id="ver">v—</div>
      <div id="bar"><i></i></div>
    </div>
    <div id="right">
      <h2>更新日志</h2>
      <div id="log"></div>
      <div id="actions">
        <button id="btn-update">检查更新</button>
        <button id="btn-enter">进入软件 →</button>
      </div>
      <div id="tip">5 秒后自动进入</div>
    </div>
  </div>
  <script src="./splash.js"></script>
</body>
</html>
